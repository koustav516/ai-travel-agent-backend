<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concierge</title>

    <!-- Apply the saved/system theme before paint so the page never flashes the wrong theme -->
    <script>
        (function () {
            let theme = null;
            try { theme = localStorage.getItem("theme"); } catch (e) { }
            if (!theme) {
                theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            if (theme === "dark") document.documentElement.classList.add("dark");
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Inter", "system-ui", "sans-serif"],
                        serif: ["Instrument Serif", "Georgia", "serif"],
                    },
                    colors: {
                        brass: { 400: "#d4b483", 500: "#b8955a", 600: "#9a7a44" },
                    },
                    keyframes: {
                        rise: { "0%": { opacity: 0, transform: "translateY(6px)" }, "100%": { opacity: 1, transform: "translateY(0)" } },
                        pulseDot: { "0%, 80%, 100%": { opacity: 0.25 }, "40%": { opacity: 1 } },
                    },
                    animation: {
                        rise: "rise 260ms ease-out both",
                        "dot-1": "pulseDot 1.2s infinite",
                        "dot-2": "pulseDot 1.2s 0.15s infinite",
                        "dot-3": "pulseDot 1.2s 0.3s infinite",
                    },
                },
            },
        };
    </script>
</head>

<body class="h-full bg-stone-50 font-sans text-stone-800 antialiased transition-colors duration-300 dark:bg-stone-950 dark:text-stone-200">
<div class="flex h-dvh flex-col">

    <!-- Header -->
    <header class="border-b border-stone-200/80 bg-stone-50/80 backdrop-blur dark:border-stone-800/80 dark:bg-stone-950/80">
        <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-4 sm:px-6">
            <div class="flex items-center gap-3">
                <div class="flex h-9 w-9 items-center justify-center rounded-full border border-brass-500/40 bg-brass-500/10">
                    <span class="font-serif text-lg italic leading-none text-brass-600 dark:text-brass-400">C</span>
                </div>
                <div>
                    <h1 class="font-serif text-2xl leading-none tracking-tight text-stone-900 dark:text-stone-50">Concierge</h1>
                    <p class="mt-1 text-xs text-stone-500 dark:text-stone-400">Your AI travel agent</p>
                </div>
            </div>

            <button id="theme-toggle" type="button" aria-label="Toggle dark mode"
                    class="flex h-9 w-9 items-center justify-center rounded-full border border-stone-200 text-stone-600 transition hover:border-stone-300 hover:bg-stone-100 hover:text-stone-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-brass-500 dark:border-stone-800 dark:text-stone-400 dark:hover:border-stone-700 dark:hover:bg-stone-900 dark:hover:text-stone-100">
                <!-- Moon (shown in light mode) -->
                <svg class="h-4 w-4 dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
                </svg>
                <!-- Sun (shown in dark mode) -->
                <svg class="hidden h-4 w-4 dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                    <circle cx="12" cy="12" r="4"/>
                    <path stroke-linecap="round" d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Conversation -->
    <main id="scroller" class="flex-1 overflow-y-auto">
        <div class="mx-auto max-w-3xl px-4 py-8 sm:px-6">

            <!-- Empty state, removed after the first message -->
            <section id="welcome" class="animate-rise pt-10 text-center sm:pt-16">
                <p class="text-xs font-medium uppercase tracking-[0.2em] text-brass-600 dark:text-brass-400">Good to see you</p>
                <h2 class="mt-3 font-serif text-4xl leading-tight text-stone-900 sm:text-5xl dark:text-stone-50">
                    Where would you like to <em class="text-brass-600 dark:text-brass-400">go</em>?
                </h2>
                <p class="mx-auto mt-4 max-w-md text-sm text-stone-500 dark:text-stone-400">
                    Search flights, find a hotel, check the weather, or let me plan the whole trip.
                </p>

                <div class="mx-auto mt-10 grid max-w-xl gap-3 sm:grid-cols-2">
                    <button type="button" data-suggestion="Find me flights from Dallas to London next Friday"
                            class="suggestion rounded-xl border border-stone-200 bg-white px-4 py-3 text-left text-sm text-stone-700 shadow-sm transition hover:-translate-y-0.5 hover:border-brass-500/50 hover:shadow-md dark:border-stone-800 dark:bg-stone-900 dark:text-stone-300 dark:hover:border-brass-500/50">
                        <span class="block text-xs text-stone-400 dark:text-stone-500">Flights</span>
                        Dallas to London next Friday
                    </button>
                    <button type="button" data-suggestion="Show me 4 star hotels in Paris under $300 a night"
                            class="suggestion rounded-xl border border-stone-200 bg-white px-4 py-3 text-left text-sm text-stone-700 shadow-sm transition hover:-translate-y-0.5 hover:border-brass-500/50 hover:shadow-md dark:border-stone-800 dark:bg-stone-900 dark:text-stone-300 dark:hover:border-brass-500/50">
                        <span class="block text-xs text-stone-400 dark:text-stone-500">Hotels</span>
                        4&#9733; Paris hotels under $300
                    </button>
                    <button type="button" data-suggestion="When is the best time to visit Tokyo, and what is the weather like there?"
                            class="suggestion rounded-xl border border-stone-200 bg-white px-4 py-3 text-left text-sm text-stone-700 shadow-sm transition hover:-translate-y-0.5 hover:border-brass-500/50 hover:shadow-md dark:border-stone-800 dark:bg-stone-900 dark:text-stone-300 dark:hover:border-brass-500/50">
                        <span class="block text-xs text-stone-400 dark:text-stone-500">Weather</span>
                        Best time to visit Tokyo
                    </button>
                    <button type="button" data-suggestion="Plan a 5 night trip from New York to Dubai, with flights, a hotel and the weather"
                            class="suggestion rounded-xl border border-stone-200 bg-white px-4 py-3 text-left text-sm text-stone-700 shadow-sm transition hover:-translate-y-0.5 hover:border-brass-500/50 hover:shadow-md dark:border-stone-800 dark:bg-stone-900 dark:text-stone-300 dark:hover:border-brass-500/50">
                        <span class="block text-xs text-stone-400 dark:text-stone-500">Full trip</span>
                        5 nights in Dubai from New York
                    </button>
                </div>
            </section>

            <!-- Messages get appended here by chat.js -->
            <div id="messages" class="space-y-6" aria-live="polite"></div>
        </div>
    </main>

    <!-- Composer -->
    <footer class="border-t border-stone-200/80 bg-stone-50/90 backdrop-blur dark:border-stone-800/80 dark:bg-stone-950/90">
        <form id="chat-form" class="mx-auto max-w-3xl px-4 py-4 sm:px-6" th:data-api="@{/chat}">
            <div class="flex items-end gap-2 rounded-2xl border border-stone-200 bg-white p-2 shadow-sm transition focus-within:border-brass-500/60 focus-within:ring-4 focus-within:ring-brass-500/10 dark:border-stone-800 dark:bg-stone-900">
                <label for="message" class="sr-only">Message</label>
                <textarea id="message" rows="1" placeholder="Where to? Ask about flights, hotels or weather&hellip;" autocomplete="off"
                          class="max-h-40 min-h-[2.5rem] flex-1 resize-none bg-transparent px-3 py-2 text-[15px] leading-6 text-stone-800 placeholder-stone-400 focus:outline-none dark:text-stone-100 dark:placeholder-stone-500"></textarea>
                <button id="send" type="submit" aria-label="Send message"
                        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-stone-900 text-stone-50 transition hover:bg-stone-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-brass-500 disabled:cursor-not-allowed disabled:opacity-40 dark:bg-stone-100 dark:text-stone-900 dark:hover:bg-white">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-6-6 6 6-6 6"/>
                    </svg>
                </button>
            </div>
            <p class="mt-2 text-center text-[11px] text-stone-400 dark:text-stone-500">
                Enter to send &middot; Shift + Enter for a new line
            </p>
        </form>
    </footer>
</div>

<script th:src="@{/js/chat.js}"></script>
</body>
</html>
